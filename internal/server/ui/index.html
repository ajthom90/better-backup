<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>better-backup</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#647084; --line:#dfe3ea; --accent:#1f6feb; --good:#1a7f4b; --warn:#9a6700; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --ink:#e6e9ef; --muted:#97a1b3; --line:#2c3340; --accent:#6ea8ff; --good:#4ac38a; --warn:#e0b341; --bad:#ff7b72; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
header h1 { font-size:17px; margin:0; flex:1; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
section { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; overflow:hidden; }
section h2 { font-size:14px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
section h2 span { flex:1; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:8px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-weight:600; font-size:12px; }
tr:last-child td { border-bottom:0; }
td.wrap { white-space:normal; word-break:break-all; }
.empty { padding:16px; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.stat { padding:14px 16px; border-right:1px solid var(--line); }
.stat b { display:block; font-size:20px; }
.stat small { color:var(--muted); }
button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:hover { filter:brightness(0.95); }
input,select,textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); width:100%; }
.pill { font-size:12px; font-weight:600; }
.success,.online { color:var(--good); } .warning,.queued,.running { color:var(--warn); } .failed,.revoked { color:var(--bad); } .offline { color:var(--muted); }
#login { max-width:420px; margin:12vh auto; padding:22px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
#login p { color:var(--muted); }
#err { color:var(--bad); min-height:1.4em; }
dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); max-width:min(560px,92vw); max-height:92vh; overflow-y:auto; padding:20px; }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog label { display:block; margin:12px 0 4px; font-weight:600; }
dialog label.check { font-weight:400; display:flex; gap:8px; align-items:center; }
dialog label.check input { width:auto; }
textarea { resize:vertical; min-height:64px; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.grid small { color:var(--muted); display:block; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.hint { color:var(--muted); font-size:12px; margin-top:4px; }
td .acts { display:flex; gap:6px; }
dialog.wide { max-width:min(860px,94vw); width:860px; }
.crumbs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:10px 0; }
.crumbs button, button.link { border:0; background:none; color:var(--accent); padding:2px 4px; }
.list { border:1px solid var(--line); border-radius:8px; max-height:50vh; overflow:auto; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:12px 0; }
dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
button.danger { color:var(--bad); }
dialog .row { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); padding:10px; border-radius:6px; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>better-backup</h1>
  <p>Enter the admin token. It is in <code>admin.json</code> in the server's data directory.</p>
  <form id="loginForm"><input id="token" type="password" placeholder="Admin token" autocomplete="current-password" required>
  <div id="err"></div><button class="primary">Sign in</button></form>
</div>
<div id="app" hidden>
<header><h1>better-backup</h1><span id="version" class="offline"></span><button id="alerts">Email alerts</button><button id="logout">Sign out</button></header>
<main>
  <section><h2><span>Repository</span><button id="runVerify">Verify all data</button><button id="runGC">Reclaim space</button></h2><div class="stats" id="stats"></div></section>
  <section><h2><span>Agents</span><button id="newToken">Add an agent</button></h2><div class="scroll" id="agents"></div></section>
  <section><h2><span>Backup policies</span><button id="newPolicy">New policy</button></h2><div class="scroll" id="policies"></div></section>
  <section><h2><span>Recent jobs</span><button id="moreJobs">Show more</button></h2><div class="scroll" id="jobs"></div></section>
  <section><h2><span>Snapshots</span></h2><div class="scroll" id="snapshots"></div></section>
</main>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("bb-token") || "";
let agentNames = {};
let agentList = [];
let jobLimit = 15;

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error("Invalid admin token"); }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
function size(n) { const u = ["B","KiB","MiB","GiB","TiB","PiB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; }
function when(t) { return t && !t.startsWith("0001") ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "never"; }
// el builds DOM nodes with textContent only, so server data is never parsed as HTML.
function el(tag, props, ...kids) { const e = Object.assign(document.createElement(tag), props || {}); for (const k of kids) e.append(k); return e; }
function table(target, heads, rows, empty) {
  const box = $(target); box.replaceChildren();
  if (!rows.length) { box.append(el("div", { className: "empty", textContent: empty })); return; }
  const t = el("table", null, el("tr", null, ...heads.map(h => el("th", { textContent: h }))));
  for (const row of rows) t.append(el("tr", null, ...row.map(c => c instanceof Node ? el("td", null, c) : el("td", { textContent: c == null ? "" : String(c) }))));
  box.append(t);
}
function pill(s) { return el("span", { className: "pill " + s, textContent: s }); }
function button(label, fn) { const b = el("button", { textContent: label }); b.onclick = () => fn().catch(e => notice("Something went wrong", e.message)); return b; }
function notice(title, text) {
  openDialog(false, el("h3", { textContent: title }), el("pre", { textContent: text }), el("div", { className: "row" }, el("button", { textContent: "Close", onclick: () => $("dlg").close() })));
}

async function refresh() {
  const [st, agents, policies, jobs, snaps] = await Promise.all([
    call("GET", "/api/v1/status"), call("GET", "/api/v1/agents"), call("GET", "/api/v1/policies"),
    call("GET", "/api/v1/jobs?limit=" + jobLimit), call("GET", "/api/v1/snapshots")]);
  $("version").textContent = "version " + st.version;
  agentList = agents;
  agentNames = Object.fromEntries(agents.map(a => [a.id, a.name]));
  const stat = (v, label) => el("div", { className: "stat" }, el("b", { textContent: v }), el("small", { textContent: label }));
  $("stats").replaceChildren(stat(st.agents, "agents"), stat(st.snapshots, "snapshots"), stat(size(st.stored_bytes), "used on disk"),
    stat(size(st.raw_bytes), "unique data before compression"), stat(st.running_jobs, "jobs running"));
  table("agents", ["Name", "Host", "System", "Version", "State", "Last seen", ""],
    agents.map(a => [a.name, a.hostname, a.os + "/" + a.arch, a.version, pill(a.revoked ? "revoked" : a.online ? "online" : "offline"), when(a.last_seen),
      a.revoked ? "" : confirmButton("Revoke", "Click again to block " + a.name, async () => { await call("DELETE", "/api/v1/agents/" + a.id); await refresh(); })]),
    "No agents yet. Choose “Add an agent” to enroll the first machine.");
  table("policies", ["Name", "Agent", "Paths", "Schedule", "Keeps", ""],
    policies.map(p => [p.name, agentNames[p.agent_id] || p.agent_id, (p.paths || []).concat((p.volumes || []).map(v => v + " (image)"), (p.vms || []).map(v => v === "*" ? "all virtual machines" : v + " (VM)"), p.system_state ? ["system state"] : []).join(", "),
      (p.schedule.interval ? "every " + p.schedule.interval : p.schedule.daily_at ? "daily at " + p.schedule.daily_at : "manual") + (p.enabled ? "" : " (paused)"),
      keeps(p.retention),
      el("div", { className: "acts" },
        button("Back up now", async () => { await call("POST", "/api/v1/policies/" + p.id + "/run"); await refresh(); }),
        button("Edit", async () => policyDialog(p)))]),
    "No policies yet. Choose “New policy” to say what to back up and when.");
  table("jobs", ["Started", "Type", "Agent", "Status", "Detail", ""],
    jobs.map(j => [when(j.created), j.type, agentNames[j.agent_id] || "server", pill(j.status),
      j.error || (j.warnings ? j.warnings.length + " warnings" : "") || (j.snapshot_id ? "snapshot " + j.snapshot_id : ""),
      button("Details", async () => jobDialog(j.id))]),
    "No jobs have run yet.");
  table("snapshots", ["Time", "Host", "Paths", "Files", "Size", "New data", ""],
    snaps.slice(0, 50).map(s => [when(s.time), s.hostname, s.sources.map(x => x.name).join(", "), s.stats.files, size(s.stats.bytes), size(s.stats.bytes_uploaded),
      el("div", { className: "acts" }, button("Browse", async () => browseDialog(s, "")), button("Restore", async () => restoreDialog(s, "")))]),
    "No snapshots yet.");
}

function keeps(r) {
  const parts = [["keep_last", "last"], ["keep_daily", "daily"], ["keep_weekly", "weekly"], ["keep_monthly", "monthly"], ["keep_yearly", "yearly"]]
    .filter(([k]) => r && r[k]).map(([k, label]) => r[k] + " " + label);
  return parts.length ? parts.join(", ") : "everything";
}
const lines = v => v.split("\n").map(x => x.trim()).filter(Boolean);

// policyDialog creates a policy, or edits p when one is given.
function policyDialog(p) {
  const active = agentList.filter(a => !a.revoked || (p && a.id === p.agent_id));
  if (!active.length) { notice("Add an agent first", "A policy backs up one machine, so enroll an agent before creating a policy."); return; }
  const name = el("input", { value: p ? p.name : "", placeholder: "For example: File server documents" });
  const agent = el("select", null, ...active.map(a => el("option", { value: a.id, textContent: a.name + " (" + a.os + ")" })));
  if (p) agent.value = p.agent_id;
  const paths = el("textarea", { rows: 3, value: p ? (p.paths || []).join("\n") : "", placeholder: "One folder or file per line, for example D:\\Shares or /home" });
  const excludes = el("textarea", { rows: 2, value: p && p.excludes ? p.excludes.join("\n") : "", placeholder: "One pattern per line, for example *.tmp or node_modules" });
  const volumes = el("textarea", { rows: 2, value: p && p.volumes ? p.volumes.join("\n") : "", placeholder: "One per line, for example C: on Windows or /dev/vg0/data on Linux" });
  const vms = el("textarea", { rows: 2, value: p && p.vms ? p.vms.join("\n") : "", placeholder: "One name per line, or * for every machine on the host" });
  const kind = el("select", null, el("option", { value: "daily", textContent: "Every day at a set time" }),
    el("option", { value: "interval", textContent: "Repeating, every so often" }), el("option", { value: "manual", textContent: "Only when started by hand" }));
  const at = el("input", { type: "time", value: p && p.schedule.daily_at ? p.schedule.daily_at : "02:00" });
  const every = el("input", { value: p && p.schedule.interval ? p.schedule.interval : "6h", placeholder: "Such as 30m, 6h or 24h" });
  kind.value = !p ? "daily" : p.schedule.interval ? "interval" : p.schedule.daily_at ? "daily" : "manual";
  const show = () => { at.hidden = kind.value !== "daily"; every.hidden = kind.value !== "interval"; };
  kind.onchange = show; show();
  const r = (p && p.retention) || (p ? {} : { keep_daily: 14, keep_weekly: 8, keep_monthly: 12 });
  const keep = {};
  const grid = el("div", { className: "grid" }, ...[["keep_last", "Most recent"], ["keep_daily", "Daily"], ["keep_weekly", "Weekly"], ["keep_monthly", "Monthly"], ["keep_yearly", "Yearly"]].map(([k, label]) => {
    keep[k] = el("input", { type: "number", min: 0, value: r[k] || "", placeholder: "0" });
    return el("div", null, keep[k], el("small", { textContent: label }));
  }));
  const enabled = el("input", { type: "checkbox", checked: p ? p.enabled : true });
  const noSnap = el("input", { type: "checkbox", checked: p ? !!p.no_snapshot : false });
  const sysState = el("input", { type: "checkbox", id: "sysState", checked: p ? !!p.system_state : false });
  const err = el("div", { id: "err" });
  const save = el("button", { className: "primary", textContent: p ? "Save changes" : "Create policy" });
  save.onclick = async () => {
    const retention = {};
    for (const k in keep) { const n = parseInt(keep[k].value, 10); if (n > 0) retention[k] = n; }
    const body = { name: name.value.trim(), agent_id: agent.value, paths: lines(paths.value), excludes: lines(excludes.value), volumes: lines(volumes.value), vms: lines(vms.value), system_state: sysState.checked,
      schedule: kind.value === "daily" ? { daily_at: at.value } : kind.value === "interval" ? { interval: every.value.trim() } : {},
      retention, enabled: enabled.checked, no_snapshot: noSnap.checked };
    try {
      await call(p ? "PUT" : "POST", "/api/v1/policies" + (p ? "/" + p.id : ""), body);
      $("dlg").close(); await refresh();
    } catch (e) { err.textContent = e.message; }
  };
  const buttons = el("div", { className: "row" });
  if (p) {
    const del = el("button", { className: "danger", textContent: "Delete policy", style: "margin-right:auto" });
    let armed = false;
    del.onclick = async () => {
      if (!armed) { armed = true; del.textContent = "Click again to delete"; err.textContent = "Deleting a policy stops its backups. Snapshots already taken are kept."; return; }
      try { await call("DELETE", "/api/v1/policies/" + p.id); $("dlg").close(); await refresh(); } catch (e) { err.textContent = e.message; }
    };
    buttons.append(del);
  }
  buttons.append(el("button", { textContent: "Cancel", onclick: () => $("dlg").close() }), save);
  $("dlgBody").replaceChildren(el("h3", { textContent: p ? "Edit policy" : "New backup policy" }),
    el("label", { textContent: "Name" }), name,
    el("label", { textContent: "Machine to back up" }), agent,
    el("label", { textContent: "Folders and files to back up" }), paths,
    el("label", { textContent: "Leave out (optional)" }), excludes,
    el("label", { textContent: "Whole volumes to back up as images (optional)" }), volumes,
    el("div", { className: "hint", textContent: "An image copies a volume block by block, so the whole volume can be put back. Free space is skipped on NTFS." }),
    el("label", { textContent: "Hyper-V virtual machines (optional)" }), vms,
    el("div", { className: "hint", textContent: "Choose the agent on the Hyper-V host. Each machine is backed up while it runs, from a checkpoint." }),
    el("label", { className: "check" }, sysState, "Windows: back up the system state"),
    el("div", { className: "hint", textContent: "The registry, boot and system files, and on a domain controller the Active Directory database and SYSVOL. It can be restored to a folder; restoring it over a running system is not built yet." }),
    el("label", { textContent: "Schedule" }), el("div", { className: "two" }, kind, el("div", null, at, every)),
    el("div", { className: "hint", textContent: "Times are in the server's time zone." }),
    el("label", { textContent: "Snapshots to keep" }), grid,
    el("div", { className: "hint", textContent: "Leave every box empty to keep all snapshots." }),
    el("label", { className: "check" }, enabled, "Run on schedule"),
    el("label", { className: "check" }, noSnap, "Windows: read live files instead of a VSS snapshot"),
    err, buttons);
  $("dlg").className = ""; if (!$("dlg").open) $("dlg").showModal();
}
$("newPolicy").onclick = () => policyDialog(null);

async function alertsDialog() {
  const a = await call("GET", "/api/v1/alerts");
  const enabled = el("input", { type: "checkbox", checked: a.enabled });
  const host = el("input", { value: a.host || "", placeholder: "smtp.example.com" });
  const port = el("input", { type: "number", min: 1, max: 65535, value: a.port || "", placeholder: "Usual port" });
  const sec = el("select", null, el("option", { value: "starttls", textContent: "STARTTLS (usually port 587)" }),
    el("option", { value: "tls", textContent: "TLS (usually port 465)" }), el("option", { value: "none", textContent: "No encryption (port 25)" }));
  sec.value = a.security || "starttls";
  const user = el("input", { value: a.username || "", placeholder: "Leave empty if the server needs no sign-in", autocomplete: "off" });
  const pass = el("input", { type: "password", placeholder: a.password_set ? "Saved. Type to replace it." : "", autocomplete: "new-password" });
  const from = el("input", { value: a.from || "", placeholder: "backups@example.com" });
  const to = el("textarea", { rows: 2, value: (a.to || []).join("\n"), placeholder: "One address per line" });
  const warn = el("input", { type: "checkbox", checked: !!a.on_warning });
  const msg = el("div", { id: "err" });
  const body = () => ({ enabled: enabled.checked, host: host.value.trim(), port: parseInt(port.value, 10) || 0, security: sec.value, username: user.value.trim(),
    password: pass.value, password_set: !pass.value && !!a.password_set && !!user.value.trim(), from: from.value.trim(), to: lines(to.value), on_warning: warn.checked });
  const say = (text, good) => { msg.textContent = text; msg.style.color = good ? "var(--good)" : ""; };
  const save = el("button", { className: "primary", textContent: "Save" });
  save.onclick = async () => { try { await call("PUT", "/api/v1/alerts", body()); $("dlg").close(); } catch (e) { say(e.message); } };
  const test = el("button", { textContent: "Save and send a test", style: "margin-right:auto" });
  test.onclick = async () => {
    say("Sending…", true);
    try {
      const saved = await call("PUT", "/api/v1/alerts", body());
      a.password_set = saved.password_set; pass.value = ""; if (saved.password_set) pass.placeholder = "Saved. Type to replace it.";
      port.value = saved.port;
      await call("POST", "/api/v1/alerts/test");
      say("Test message sent. Check the inbox.", true);
    } catch (e) { say(e.message); }
  };
  $("dlgBody").replaceChildren(el("h3", { textContent: "Email alerts" }),
    el("div", { className: "hint", textContent: "Sends an email when a backup, restore or repository check fails, and when a scheduled backup is missed, for example because a machine is switched off." }),
    el("label", { className: "check" }, enabled, "Send email alerts"),
    el("label", { textContent: "Mail server (SMTP)" }), el("div", { className: "two" }, host, port),
    el("label", { textContent: "Connection security" }), sec,
    el("label", { textContent: "Sign in as" }), el("div", { className: "two" }, user, pass),
    el("label", { textContent: "From address" }), from,
    el("label", { textContent: "Send alerts to" }), to,
    el("label", { className: "check" }, warn, "Also email when a backup finishes with warnings, such as skipped files"),
    msg, el("div", { className: "row" }, test, el("button", { textContent: "Close", onclick: () => $("dlg").close() }), save));
  $("dlg").className = ""; if (!$("dlg").open) $("dlg").showModal();
}
$("alerts").onclick = () => alertsDialog().catch(e => notice("Something went wrong", e.message));

// confirmButton asks for a second click before doing something that
// cannot be undone.
function confirmButton(label, sure, fn) {
  const b = el("button", { className: "danger", textContent: label });
  let armed = false;
  b.onclick = () => {
    if (!armed) { armed = true; b.textContent = sure; setTimeout(() => { armed = false; b.textContent = label; }, 5000); return; }
    fn().catch(e => notice("Something went wrong", e.message));
  };
  return b;
}
function openDialog(wide, ...kids) { $("dlg").className = wide ? "wide" : ""; $("dlgBody").replaceChildren(...kids); if (!$("dlg").open) $("dlg").showModal(); }
const sepOf = s => s.os === "windows" ? "\\" : "/";
const joinPath = (s, dir, name) => !dir ? name : dir.endsWith(sepOf(s)) ? dir + name : dir + sepOf(s) + name;
const kinds = { dir: "Folder", file: "File", symlink: "Link", image: "Disk image", vm: "Virtual machine" };

// restoreDialog starts a restore of a whole snapshot, or of one path.
function restoreDialog(s, path) {
  const agents = agentList.filter(a => !a.revoked);
  const agent = el("select", null, ...agents.map(a => el("option", { value: a.id, textContent: a.name + " (" + a.os + ")" + (a.id === s.agent_id ? ", the original machine" : "") })));
  if (agents.some(a => a.id === s.agent_id)) agent.value = s.agent_id;
  const target = el("input", { placeholder: "Leave empty to restore in place, over the originals" });
  const only = el("input", { value: path || "", placeholder: "Leave empty to restore everything in the snapshot" });
  const mode = el("select", null, el("option", { value: "if-changed", textContent: "Replace files that differ from the backup" }),
    el("option", { value: "always", textContent: "Replace every file" }), el("option", { value: "never", textContent: "Only restore missing files" }));
  const vmName = el("input", { id: "vmName", placeholder: "Leave empty to keep its old name" });
  const err = el("div", { id: "err" });
  const go = el("button", { className: "primary", textContent: "Start restore" });
  go.onclick = async () => {
    try {
      const j = await call("POST", "/api/v1/restores", { snapshot_id: s.id, agent_id: agent.value, target: target.value.trim(), include: only.value.trim() ? [only.value.trim()] : [], overwrite: mode.value, vm_name: vmName.value.trim() });
      await refresh(); await jobDialog(j.id);
    } catch (e) { err.textContent = e.message; }
  };
  openDialog(false, el("h3", { textContent: "Restore from " + s.hostname + ", " + when(s.time) }),
    el("label", { textContent: "Restore onto" }), agent,
    el("label", { textContent: "Only this file, folder or disk" }), only,
    el("div", { className: "hint", textContent: "The original path. Use Browse on a snapshot to pick one." }),
    el("label", { textContent: "Put it in" }), target,
    el("div", { className: "hint", textContent: "A folder on the chosen machine. A disk image can also go to a volume (E:), a device, or a new file (.img, or .vhdx on Windows). Restoring onto a different machine needs a folder here." }),
    el("label", { textContent: "Existing files" }), mode,
    el("label", { textContent: "Name for a restored virtual machine" }), vmName,
    el("div", { className: "hint", textContent: "Only for Hyper-V machines. A virtual machine is restored as a new machine, switched off, with its disks in the folder above, which must be on a Hyper-V host." }),
    err, el("div", { className: "row" }, el("button", { textContent: "Cancel", onclick: () => $("dlg").close() }), go));
}

// browseDialog shows what a snapshot holds at a path.
async function browseDialog(s, path, trail) {
  trail = trail || [];
  const items = await call("GET", "/api/v1/snapshots/" + s.id + "/ls?path=" + encodeURIComponent(path));
  const crumbs = el("div", { className: "crumbs" }, el("button", { textContent: "Snapshot", onclick: () => browseDialog(s, "", []).catch(e => notice("Something went wrong", e.message)) }));
  trail.forEach((t, i) => crumbs.append("›", el("button", { textContent: t.label, onclick: () => browseDialog(s, t.path, trail.slice(0, i + 1)).catch(e => notice("Something went wrong", e.message)) })));
  const t = el("table", null, el("tr", null, ...["Name", "Kind", "Size", "Changed", ""].map(h => el("th", { textContent: h }))));
  items.sort((a, b) => (a.type === "dir" ? 0 : 1) - (b.type === "dir" ? 0 : 1) || a.name.localeCompare(b.name));
  for (const it of items) {
    const full = joinPath(s, path, it.name);
    const open = it.type === "dir" || it.type === "vm";
    const name = open ? el("button", { className: "link", textContent: it.name, onclick: () => browseDialog(s, full, trail.concat({ label: it.name, path: full })).catch(e => notice("Something went wrong", e.message)) }) : it.name;
    t.append(el("tr", null, el("td", { className: "wrap" }, name), el("td", { textContent: kinds[it.type] || it.type }),
      el("td", { textContent: open ? "" : size(it.size) }), el("td", { textContent: when(it.mtime) }),
      el("td", null, button("Restore", async () => restoreDialog(s, full)))));
  }
  const body = items.length ? el("div", { className: "list" }, t) : el("div", { className: "empty", textContent: "This folder is empty." });
  const row = el("div", { className: "row" },
    Object.assign(confirmButton("Forget this snapshot", "Click again to delete this snapshot", async () => { await call("DELETE", "/api/v1/snapshots/" + s.id); $("dlg").close(); await refresh(); }), { style: "margin-right:auto" }),
    el("button", { textContent: "Close", onclick: () => $("dlg").close() }));
  if (path) row.append(el("button", { className: "primary", textContent: "Restore this folder", onclick: () => restoreDialog(s, path) }));
  else row.append(el("button", { className: "primary", textContent: "Restore everything", onclick: () => restoreDialog(s, "") }));
  openDialog(true, el("h3", { textContent: s.hostname + ", " + when(s.time) }), crumbs, body, row);
}

const labels = { files: "Files", dirs: "Folders", bytes: "Size", files_changed: "Files changed", bytes_read: "Data read", bytes_uploaded: "New data stored",
  chunks_new: "New chunks", warnings: "Warnings", skipped: "Already up to date", packs_removed: "Pack files removed", packs_rewritten: "Pack files rewritten",
  bytes_freed: "Space freed", chunks_removed: "Chunks removed", chunks: "Chunks checked", packs: "Pack files checked", errors: "Errors" };
function facts(dl, obj) {
  for (const k in obj || {}) {
    const v = obj[k];
    if (v == null || typeof v === "object" && !Array.isArray(v)) continue;
    const text = Array.isArray(v) ? v.join("\n") : /bytes/.test(k) ? size(v) : String(v);
    if (text === "") continue;
    dl.append(el("dt", { textContent: labels[k] || k.replace(/_/g, " ") }), el("dd", { textContent: text }));
  }
}
// jobDialog shows one job and follows it while it runs.
let jobTimer;
async function jobDialog(id) {
  clearTimeout(jobTimer);
  const j = await call("GET", "/api/v1/jobs/" + id);
  const dl = el("dl");
  const add = (k, v) => { if (v) dl.append(el("dt", { textContent: k }), el("dd", null, v)); };
  add("Status", pill(j.status));
  add("Machine", agentNames[j.agent_id] || (j.agent_id ? j.agent_id : "the server"));
  add("Queued", when(j.created)); add("Started", j.started ? when(j.started) : ""); add("Finished", j.finished ? when(j.finished) : "");
  add("Snapshot", j.snapshot_id || "");
  if (j.restore) { add("Restored to", j.restore.target || "the original location"); add("Only", (j.restore.include || []).join(", ")); }
  add("Error", j.error || "");
  facts(dl, j.result || j.progress);
  const kids = [el("h3", { textContent: j.type.charAt(0).toUpperCase() + j.type.slice(1) + " job" }), dl];
  if (j.warnings && j.warnings.length) kids.push(el("label", { textContent: "Warnings (" + j.warnings.length + ")" }), el("pre", { textContent: j.warnings.join("\n"), style: "max-height:30vh;overflow:auto" }));
  kids.push(el("div", { className: "row" }, el("button", { textContent: "Close", onclick: () => { clearTimeout(jobTimer); $("dlg").close(); } })));
  openDialog(true, ...kids);
  if (j.status === "queued" || j.status === "running") jobTimer = setTimeout(() => { if ($("dlg").open) jobDialog(id).catch(() => {}); }, 2000);
}
$("dlg").addEventListener("close", () => clearTimeout(jobTimer));
for (const [id, kind] of [["runGC", "gc"], ["runVerify", "verify"]]) {
  $(id).onclick = async () => { try { const j = await call("POST", "/api/v1/repo/" + kind); await refresh(); await jobDialog(j.id); } catch (e) { notice("Something went wrong", e.message); } };
}
$("moreJobs").onclick = () => { jobLimit = jobLimit === 15 ? 100 : 15; $("moreJobs").textContent = jobLimit === 15 ? "Show more" : "Show fewer"; refresh().catch(() => {}); };

$("newToken").onclick = async () => {
  try {
    const t = await call("POST", "/api/v1/enroll-tokens", { ttl: "24h", uses: 1 });
    notice("Add an agent", "Install bb-agent on the machine, then run this there within 24 hours:\n\nbb-agent enroll --server " + location.origin + " --token " + t.token + " --fingerprint " + t.fingerprint + "\n\nThen start it with: bb-agent service install && bb-agent service start");
  } catch (e) { notice("Could not create a token", e.message); }
};
function signOut() { token = ""; sessionStorage.removeItem("bb-token"); $("app").hidden = true; $("login").hidden = false; }
$("logout").onclick = signOut;
$("loginForm").onsubmit = async ev => {
  ev.preventDefault(); token = $("token").value.trim(); $("err").textContent = "";
  try { await call("GET", "/api/v1/status"); sessionStorage.setItem("bb-token", token); start(); } catch (e) { $("err").textContent = e.message; }
};
let timer;
function start() {
  $("login").hidden = true; $("app").hidden = false;
  refresh().catch(() => {});
  clearInterval(timer); timer = setInterval(() => { if (token && !$("dlg").open) refresh().catch(() => {}); }, 5000);
}
if (token) start(); else $("login").hidden = false;
</script>
</body>
