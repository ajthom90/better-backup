<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Backup</title>
<style>
:root { color-scheme: light; --bg:#f3f4f5; --card:#fff; --ink:#1a1f24; --muted:#56616b; --line:#d7dce0; --accent:#0b6b5d; --on-accent:#fff; --tint:#e6f1ee; --good:#1c7a45; --warn:#855600; --bad:#b3261e; --s1:#257de0; --s2:#f47230; --r:8px; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#14181b; --card:#1c2125; --ink:#e8ebed; --muted:#a3adb6; --line:#313940; --accent:#4fc3ad; --on-accent:#0b1a17; --tint:#1d302c; --good:#5fcf8f; --warn:#e3b341; --bad:#ff8a80; --s1:#338ced; --s2:#e76624; } }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
h1,h2,h3,h4 { text-wrap:balance; line-height:1.25; }
p,li,.hint,dd { text-wrap:pretty; }
a { color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.skip { position:absolute; left:-999px; } .skip:focus { left:8px; top:8px; background:var(--card); padding:8px 12px; z-index:5; }

/* The frame: pages on the left, the page itself on the right. */
#app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
#side { border-right:1px solid var(--line); background:var(--card); padding:20px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { font-weight:700; font-size:17px; padding:0 10px 14px; }
.brand span { display:block; font-weight:400; font-size:13px; color:var(--muted); }
#side a.nav, #side button { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; font:inherit; font-size:15px; color:var(--ink); background:none; border:0; border-radius:6px; padding:7px 10px; text-decoration:none; cursor:pointer; white-space:normal; }
#side a.nav:hover, #side button:hover { background:var(--bg); filter:none; }
#side a.nav[aria-current=page] { background:var(--tint); font-weight:600; }
#side .count { font-size:13px; font-weight:600; color:var(--bad); }
.navhead { font-size:13px; color:var(--muted); padding:18px 10px 4px; }
.who { margin-top:auto; padding-top:18px; } #whoami { display:block; font-size:13px; color:var(--muted); padding:0 10px 4px; overflow-wrap:anywhere; }
main { padding:28px 32px 72px; max-width:1240px; width:100%; }
@media (max-width:860px) {
  #app { display:block; }
  #side { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); flex-direction:row; flex-wrap:wrap; padding:10px 12px; }
  #side a.nav, #side button { width:auto; } .brand { width:100%; padding-bottom:6px; } .navhead { display:none; } .who { margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; } #whoami { padding:7px 10px; }
  main { padding:20px 16px 56px; }
}

.pagehead { display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; margin:0 0 6px; }
.pagehead h1 { font-size:26px; margin:0; flex:1 1 auto; }
.lede { color:var(--muted); margin:0 0 22px; max-width:72ch; }
section { background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:0 0 20px; overflow:hidden; }
section > h2, .sechead { font-size:16px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
section > h2 > span:first-child, .sechead > h2 { flex:1 1 auto; margin:0; font-size:16px; }
.sechead .sub { flex:1 1 100%; }
.pad { padding:14px 16px; }
.sub { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { text-align:left; padding:9px 16px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; }
tr:last-child td { border-bottom:0; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.wrap { white-space:normal; overflow-wrap:anywhere; min-width:180px; }
td .sub { white-space:normal; }
.empty { padding:18px 16px; color:var(--muted); }
.empty b { color:var(--ink); display:block; }
#searchHits td { white-space:normal; overflow-wrap:anywhere; }

button, .btn { font:inherit; font-size:14px; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; transition:background-color .15s; }
button:hover { background:var(--bg); }
button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
button.primary:hover { filter:brightness(1.08); background:var(--accent); }
button.danger { color:var(--bad); }
button.link, .crumbs button { border:0; background:none; color:var(--accent); padding:2px 4px; text-align:left; white-space:normal; }
button:disabled { opacity:.55; cursor:default; }
input,select,textarea { font:inherit; font-size:15px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); width:100%; }
input[type=checkbox], input[type=radio] { width:auto; accent-color:var(--accent); }
textarea { resize:vertical; min-height:64px; }
label { font-size:14px; }

/* States: a shape and a word, never the colour alone. */
.pill { font-size:13px; font-weight:600; white-space:nowrap; }
.pill::before { content:"● "; }
.pill.warning::before, .pill.overdue::before, .pill.queued::before { content:"▲ "; }
.pill.failed::before, .pill.revoked::before, .pill.suspicious::before { content:"■ "; }
.pill.offline::before, .pill.cancelled::before, .pill.paused::before, .pill.never::before, .pill.off::before { content:"○ "; }
.success,.online,.ok { color:var(--good); } .warning,.queued,.running { color:var(--warn); } .failed,.revoked,.overdue,.suspicious { color:var(--bad); } .offline,.cancelled,.paused,.never,.off,.locked { color:var(--muted); }
.issues { margin:0; padding:12px 16px 12px 36px; border-bottom:1px solid var(--line); } .issues li { margin:3px 0; } .issues li.failed { color:var(--bad); } .issues li.warning { color:var(--warn); }
.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px 24px; margin:0; padding:14px 16px; }
.facts div { min-width:0; } .facts dt { color:var(--muted); font-size:13px; } .facts dd { margin:0; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; } .facts .pill { white-space:normal; }
.usage { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:14px; }
.usage svg { flex:0 0 220px; height:44px; } .usage span { flex:1; min-width:240px; }
.banner { border:1px solid var(--warn); border-radius:var(--r); background:var(--card); padding:12px 16px; margin-bottom:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.banner span { flex:1; min-width:240px; } .banner.alarm { border-color:var(--bad); }
.acts { display:flex; gap:6px; flex-wrap:wrap; } td .acts { flex-wrap:nowrap; align-items:center; justify-content:flex-end; }
.bar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:end; padding:12px 16px; border-bottom:1px solid var(--line); }
.bar label { display:grid; gap:3px; color:var(--muted); font-size:13px; } .bar label.check { display:flex; align-items:center; gap:6px; color:var(--ink); font-size:14px; padding-bottom:7px; }
.bar select, .bar input:not([type=checkbox]) { width:auto; min-width:150px; max-width:100%; } .bar .grow { flex:1 1 220px; } .bar .grow input { width:100%; } .bar .end { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; margin:0 0 16px; border-bottom:1px solid var(--line); }
.tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 12px; font-size:15px; color:var(--muted); }
.tabs button[aria-selected=true] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }

/* Sources and schedules. */
.machine-head { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
.machine-head h2 { font-size:17px; margin:0; } .machine-head .sub { flex:1 1 200px; }
.week { display:inline-grid; grid-template-columns:repeat(7,auto); gap:4px; font-size:13px; }
.week span { padding:2px 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
.week span.on { background:var(--tint); border-color:transparent; color:var(--ink); font-weight:600; }
.week span:not(.on) { text-decoration:line-through; text-decoration-thickness:1px; }
.sched { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:16px 28px; padding:14px 16px; }
.sched ul { margin:0; padding:0; list-style:none; } .sched li { padding:4px 0; } .sched li + li { border-top:1px solid var(--line); }
@media (max-width:760px) { .sched { grid-template-columns:1fr; } }
.switch { display:inline-flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; }

/* The editor: one column of fields with visible labels. */
.form { max-width:820px; }
.form section { overflow:visible; }
.field { margin:0 0 16px; } .field:last-child { margin-bottom:0; }
.field > label, .front label, dialog label { display:block; margin:0 0 4px; font-weight:600; font-size:14px; }
label.check { font-weight:400 !important; display:flex !important; gap:8px; align-items:baseline; margin:6px 0 !important; }
label.check input { flex:none; position:relative; top:1px; }
.hint { color:var(--muted); font-size:13px; margin-top:4px; max-width:75ch; }
.inline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .inline input, .inline select { width:auto; } .inline input[type=number] { width:84px; }
.days { display:flex; flex-wrap:wrap; gap:6px; } .days label { display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:14px; }
.days label:has(input:checked) { background:var(--tint); border-color:var(--accent); }
.tree { border:1px solid var(--line); border-radius:6px; }
.node + .node { border-top:1px solid var(--line); }
.node-head { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:9px 12px; }
.node-head label { display:flex; gap:8px; align-items:center; font-weight:600; font-size:15px; } .node-head .sub { flex:1 1 220px; }
.node-body { padding:4px 12px 14px 38px; border-top:1px dashed var(--line); }
.savebar { position:sticky; bottom:0; background:var(--bg); padding:12px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line); }
.savebar .msg { flex:1 1 240px; margin:0; }
.msg, #err { color:var(--bad); min-height:1.4em; margin-top:8px; font-size:14px; }

/* Graphs. */
.charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:20px; }
.charts section { margin:0; }
.chart { position:relative; padding:8px 16px 12px; }
.chart svg { display:block; width:100%; height:auto; overflow:visible; }
.chart text { font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums; }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; padding:10px 16px 0; }
.legend i, .tip i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
.tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; white-space:nowrap; z-index:2; font-variant-numeric:tabular-nums; }
.tip b { display:block; }
details.numbers { padding:0 16px 12px; font-size:13px; margin:0; } details.numbers .scroll { max-height:240px; overflow:auto; margin-top:8px; border:1px solid var(--line); border-radius:6px; }
.meter { height:10px; border-radius:5px; background:var(--bg); overflow:hidden; } .meter i { display:block; height:100%; background:var(--s1); border-radius:5px; }
.savings { display:grid; grid-template-columns:max-content 1fr max-content; gap:8px 12px; align-items:center; padding:14px 16px; font-size:14px; }
.savings .num { text-align:right; font-variant-numeric:tabular-nums; }

/* Dialogs and the pages before sign-in. */
dialog { border:1px solid var(--line); border-radius:var(--r); background:var(--card); color:var(--ink); width:560px; max-width:92vw; max-height:92vh; overflow-y:auto; padding:22px; }
dialog.wide { max-width:94vw; width:900px; }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog h3 { margin:0 0 10px; font-size:19px; }
dialog label { margin-top:14px; }
dialog a { color:var(--accent); }
dialog .row, .front .row { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; flex-wrap:wrap; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; } .grid small { color:var(--muted); display:block; font-size:13px; }
@media (max-width:560px) { .grid { grid-template-columns:repeat(2,1fr); } .two { grid-template-columns:1fr !important; } }
.two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
a.upd { font-size:13px; color:var(--muted); margin-left:4px; } a.upd.bad, td.bad { color:var(--bad); }
.warn, .pending { border:1px solid var(--warn); border-radius:6px; padding:10px 12px; margin-top:12px; font-size:14px; }
.pending { display:flex; gap:12px; align-items:center; flex-wrap:wrap; } .pending span { flex:1; min-width:220px; }
.crumbs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:10px 0; font-size:14px; }
.list { border:1px solid var(--line); border-radius:6px; max-height:50vh; overflow:auto; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:12px 0; font-size:14px; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.copybox { display:flex; gap:8px; align-items:flex-start; } .copybox pre { flex:1; margin:0; max-height:7.5em; overflow:auto; } #nasFolder ~ .copybox pre { max-height:none; }
pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); padding:10px; border-radius:6px; font-size:13px; }
.machine { border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin:10px 0; }
.machine h4 { margin:0 0 6px; font-size:15px; display:flex; gap:10px; align-items:center; }
.machine .acts { margin-top:10px; }
.code { font:600 18px ui-monospace,Consolas,monospace; letter-spacing:1px; }
.steps { margin:8px 0; padding-left:20px; } .steps li { margin:4px 0; }
.picklist { border:1px solid var(--line); border-radius:6px; max-height:240px; overflow:auto; padding:4px 10px 8px; margin-top:8px; font-size:14px; }
details { margin-top:12px; font-size:14px; } summary { cursor:pointer; color:var(--accent); } summary.sechead { display:list-item; list-style-position:inside; }
.warnbox { color:var(--warn); margin:8px 0; }
.front { max-width:460px; margin:10vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); }
.front h1 { font-size:22px; margin:0 0 6px; } .front p { color:var(--muted); } .front label { margin-top:14px; }
.front .row { justify-content:flex-start; align-items:center; } .front hr { border:0; border-top:1px solid var(--line); margin:18px 0; }
table.loose td { white-space:normal; overflow-wrap:anywhere; padding:8px 10px; } table.loose th { padding:8px 10px; } table.loose td:last-child { white-space:nowrap; overflow-wrap:normal; }
td.reasons { min-width:240px; } td.reasons ul { margin:0; padding-left:18px; } td.holds { min-width:150px; }
progress { width:100%; height:14px; }
body.role-viewer .need-operator, body.role-viewer .need-admin, body.role-operator .need-admin { display:none !important; }
h4 { margin:18px 0 4px; }
[hidden] { display:none !important; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="front" class="front" hidden></div>
<div id="app" hidden>
<a class="skip" href="#main">Skip to the page</a>
<aside id="side">
  <div class="brand">Better Backup<span id="version"></span></div>
  <nav aria-label="Pages">
    <a class="nav" href="#overview">Overview<span class="count" id="navCount"></span></a>
    <a class="nav" href="#sources">Sources</a>
    <a class="nav" href="#schedules">Schedules</a>
    <a class="nav" href="#restore">Restore</a>
    <a class="nav" href="#reports">Reports</a>
    <a class="nav" href="#graphs">Graphs</a>
    <a class="nav" href="#offsite">Offsite copy</a>
  </nav>
  <div class="navhead">Set up</div>
  <button id="protect">Ransomware protection</button>
  <button id="recovery" class="need-operator">Bare-metal recovery</button>
  <button id="m365" class="need-admin">Microsoft 365</button>
  <button id="vmware" class="need-admin">VMware servers</button>
  <button id="alerts" class="need-admin">Alerts and summaries</button>
  <button id="users" class="need-admin">Users</button>
  <button id="activity" class="need-admin">Activity log</button>
  <button id="settings" class="need-admin">Settings</button>
  <div class="who"><span id="whoami"></span><button id="account">My password</button><button id="logout">Sign out</button></div>
</aside>
<main id="main" tabindex="-1">
  <div class="banner need-admin" id="keyBanner" hidden><span><b>Keep a copy of the repository key.</b> Without it, neither the backups on this server nor the offsite copy can be read. Download it and keep it somewhere other than this server.</span><button class="primary" id="keyBannerBtn">Download the key</button></div>
  <div class="banner alarm" id="susBanner" hidden><span id="susText"></span><button class="primary" id="susBtn">Look at it</button></div>
  <div id="page"></div>
</main>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("bb-token") || "";
let agentNames = {};
let agentList = [];
let snapList = [];
let vmwareList = [];
let m365List = [];
let jobLimit = 15;
let me = null; // the signed-in user

async function call(method, path, body, headers) {
  const r = await fetch(path, { method, headers: Object.assign({ Authorization: "Bearer " + token, "Content-Type": "application/json" }, headers || {}), body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error("You are signed out. Sign in again."); }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
function size(n) { const u = ["B","KiB","MiB","GiB","TiB","PiB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; }
function when(t) { return t && !t.startsWith("0001") ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "never"; }
// el builds DOM nodes with textContent only, so server data is never parsed as HTML.
function el(tag, props, ...kids) { const e = Object.assign(document.createElement(tag), props || {}); for (const k of kids) e.append(k); return e; }
function table(target, heads, rows, empty) {
  const box = $(target); box.replaceChildren();
  if (!rows.length) { box.append(el("div", { className: "empty", textContent: empty })); return; }
  const t = el("table", null, el("tr", null, ...heads.map(h => el("th", { textContent: h }))));
  for (const row of rows) t.append(el("tr", null, ...row.map(c => c instanceof Node ? el("td", null, c) : el("td", { textContent: c == null ? "" : String(c) }))));
  box.append(t);
}
const pillNames = { success: "Good", warning: "Warnings", failed: "Failed", running: "Running", queued: "Waiting", cancelled: "Cancelled", online: "Online", offline: "Offline", revoked: "Removed" };
function pill(s) { return el("span", { className: "pill " + s, textContent: pillNames[s] || s }); }
function button(label, fn) { const b = el("button", { textContent: label }); b.onclick = () => fn().catch(e => notice("Something went wrong", e.message)); return b; }
function notice(title, text) {
  openDialog(false, el("h3", { textContent: title }), el("pre", { textContent: text }), el("div", { className: "row" }, el("button", { textContent: "Close", onclick: () => $("dlg").close() })));
}

// updateWord says in a few words where an agent's own updating stands.
function updateWord(a) {
  const u = a.update;
  if (!u || a.revoked) return "";
  if (u.state === "installing") return "updating to " + u.target + "…";
  if (u.asked) return "will update to " + u.available + (a.online ? " shortly" : " when it connects");
  if (u.state === "failed" && u.available === u.target) return "update to " + u.target + " failed";
  if (u.available) return u.available + " is available" + (u.auto ? ", updates by itself" : "");
  if (!u.can && u.why && agentNewest && a.version !== agentNewest) return "does not update by itself";
  return "";
}
function versionCell(a) {
  const word = updateWord(a);
  if (!word) return a.version;
  const failed = a.update.state === "failed" && a.update.available === a.update.target;
  return el("span", null, a.version + " ", el("a", { href: "#", className: "upd" + (failed ? " bad" : ""), textContent: word, title: "Agent updates",
    onclick: ev => { ev.preventDefault(); updatesDialog().catch(e => notice("Something went wrong", e.message)); } }));
}
let agentNewest = "";
// updatesDialog: whether agents update by themselves, each agent's version and state, and "Update now".
async function updatesDialog() {
  const [set, all] = await Promise.all([call("GET", "/api/v1/agent-updates"), call("GET", "/api/v1/agents")]);
  const agents = all.filter(a => !a.recovery && !a.revoked && a.update);
  agentNewest = set.newest || "";
  const msg = el("div", { className: "msg", id: "updMsg" });

      el("button", { id: "offsite", className: "primary need-operator", textContent: "Settings", onclick: () => offsiteDialog().catch(oops) })), el("div", { id: "offBody" }));
    await this.tick(root);
  },
  async tick(root) {
    const box = (root || document).querySelector("#offBody");
    if (!box) return;
    const o = shared.off, btn = (root || document).querySelector("#offsiteNow");
    if (btn) btn.hidden = !o.kind;
    if (!o.kind) { box.replaceChildren(el("section", null, el("div", { className: "empty" }, el("b", { textContent: "The offsite copy is not set up." }), "Choose “Settings” to send a copy to S3-compatible storage or to a folder on another disk or share."))); return; }
    const [jobs, g] = await Promise.all([call("GET", "/api/v1/jobs?type=offsite&limit=10"), call("GET", "/api/v1/graphs?days=30")]);
    const j = o.last_job, q = o.queue || { files: 0, bytes: 0 }, busy = j && (j.status === "running" || j.status === "queued");
    const state = busy ? ["running", "Copying now"] : j && j.status === "failed" ? ["failed", "The last run failed"] : !o.enabled ? ["paused", "Paused"] : !o.last_success ? ["never", "Not copied yet"] : q.files ? ["warning", "Behind: new backups wait to be copied"] : ["ok", "Up to date"];
    const fact = (k, v, id) => el("div", null, el("dt", { textContent: k }), el("dd", { id: id || "" }, v));
    const where = o.kind === "s3" ? "Bucket " + o.bucket + (o.prefix ? "/" + o.prefix : "") : o.folder;
    box.replaceChildren(
      sec("Status", [], el("dl", { className: "facts" },
        fact("State", el("span", { className: "pill " + state[0], textContent: state[1] }), "offState"), fact("Where", where),
        fact("Last complete copy", o.last_success ? when(o.last_success) : "Never"), fact("Stored in the copy", o.stored_bytes ? size(o.stored_bytes) + " in " + plural(o.stored_objects, "file", "files") : "Nothing yet"),
        fact("Waiting to be copied", q.files ? size(q.bytes) + " in " + plural(q.files, "file", "files") : "Nothing", "offQueue"), fact("Oldest waiting", q.oldest ? ago(q.oldest) + " old" : "Nothing waits"),
        fact("Speed of the last copy", o.rate ? rate(o.rate) : "Nothing was sent"), fact("Runs", o.enabled ? (o.daily_at ? "Every day at " + clock(o.daily_at) : "Only when started by hand") : "Paused"),
        o.lock_days ? fact("Locked against deletion", o.locked_until ? "Until at least " + day(o.locked_until) : "From the next copy on") : ""),
        j && j.status === "failed" ? el("div", { className: "pad", style: "border-top:1px solid var(--line);color:var(--bad)", textContent: "The run of " + when(j.created) + " failed: " + j.error }) : ""),
      chartBox("Sent to the offsite copy, by day", { kind: "bar", width: 900, xs: g.daily.map(d => new Date(d.day + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" })), series: [{ name: "Sent", color: "var(--s1)", pts: g.daily.map(d => d.offsite_bytes) }], fmt: size, empty: "Nothing was sent in the last 30 days." }, "The last 30 days."),
      sec("Latest runs", [], jobTable(jobs, "The copy has not run yet.")));
  }
};
boot();
</script>
