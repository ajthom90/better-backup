<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>better-backup</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#647084; --line:#dfe3ea; --accent:#1f6feb; --good:#1a7f4b; --warn:#9a6700; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --ink:#e6e9ef; --muted:#97a1b3; --line:#2c3340; --accent:#6ea8ff; --good:#4ac38a; --warn:#e0b341; --bad:#ff7b72; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
header h1 { font-size:17px; margin:0; flex:1; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
section { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; overflow:hidden; }
section h2 { font-size:14px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
section h2 span { flex:1; }
#searchForm { display:flex; gap:6px; margin:0; } #searchForm input { width:300px; max-width:42vw; font-weight:400; }
.sub { color:var(--muted); font-size:12px; word-break:break-all; }
#searchHits td { white-space:normal; overflow-wrap:anywhere; vertical-align:top; }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:8px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-weight:600; font-size:12px; }
tr:last-child td { border-bottom:0; }
td.wrap { white-space:normal; word-break:break-all; }
.empty { padding:16px; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.stat { padding:14px 16px; border-right:1px solid var(--line); }
.stat b { display:block; font-size:20px; }
.stat small { color:var(--muted); }
button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:hover { filter:brightness(0.95); }
input,select,textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); width:100%; }
.pill { font-size:12px; font-weight:600; }
.success,.online { color:var(--good); } .warning,.queued,.running { color:var(--warn); } .failed,.revoked { color:var(--bad); } .offline,.cancelled,.paused,.never { color:var(--muted); } .ok { color:var(--good); } .overdue { color:var(--bad); }
.issues { margin:0; padding:10px 16px 10px 34px; border-bottom:1px solid var(--line); } .issues li { margin:3px 0; } .issues li.failed { color:var(--bad); } .issues li.warning { color:var(--warn); }
.usage { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; color:var(--muted); }
.usage svg { flex:0 0 220px; height:44px; } .usage span { flex:1; min-width:240px; }
#login { max-width:420px; margin:12vh auto; padding:22px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
#login p { color:var(--muted); }
#err { color:var(--bad); min-height:1.4em; }
dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); max-width:min(560px,92vw); max-height:92vh; overflow-y:auto; padding:20px; }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog label { display:block; margin:12px 0 4px; font-weight:600; }
dialog label.check { font-weight:400; display:flex; gap:8px; align-items:center; }
dialog label.check input { width:auto; }
textarea { resize:vertical; min-height:64px; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.grid small { color:var(--muted); display:block; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.hint { color:var(--muted); font-size:12px; margin-top:4px; }
.warn { border:1px solid #d97706; border-left-width:4px; border-radius:6px; padding:8px 10px; margin-top:10px; font-size:13px; }
td .acts { display:flex; gap:6px; }
dialog.wide { max-width:min(860px,94vw); width:860px; }
.crumbs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:10px 0; }
.crumbs button, button.link { border:0; background:none; color:var(--accent); padding:2px 4px; }
.list { border:1px solid var(--line); border-radius:8px; max-height:50vh; overflow:auto; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:12px 0; }
dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
button.danger { color:var(--bad); }
dialog .row { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.copybox { display:flex; gap:8px; align-items:flex-start; } .copybox pre { flex:1; margin:0; max-height:7.5em; overflow:auto; } #nasFolder ~ .copybox pre { max-height:none; }
dialog a { color:var(--accent); }
pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); padding:10px; border-radius:6px; }
.machine { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; }
.machine h4 { margin:0 0 6px; font-size:15px; display:flex; gap:10px; align-items:center; }
.code { font:600 18px ui-monospace,Consolas,monospace; letter-spacing:1px; }
.machine .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.steps { margin:8px 0; padding-left:20px; } .steps li { margin:4px 0; }
.picklist { border:1px solid var(--line); border-radius:8px; max-height:220px; overflow:auto; padding:2px 10px 8px; margin-top:8px; }
details { margin-top:12px; font-size:13px; } summary { cursor:pointer; color:var(--accent); }
.warnbox { color:var(--warn); margin:8px 0; }
header { flex-wrap:wrap; }
header h1 { min-width:140px; }
#whoami { color:var(--muted); }
.front { max-width:460px; margin:10vh auto; padding:22px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
.front h1 { font-size:20px; margin:0 0 6px; }
.front p { color:var(--muted); }
.front label { display:block; margin:12px 0 4px; font-weight:600; }
.front .row { display:flex; gap:8px; margin-top:16px; align-items:center; flex-wrap:wrap; }
.front .msg, .msg { color:var(--bad); min-height:1.4em; margin-top:8px; }
.front hr { border:0; border-top:1px solid var(--line); margin:18px 0; }
.banner { border:1px solid #d97706; border-left-width:4px; border-radius:8px; background:var(--card); padding:10px 14px; margin-bottom:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.banner span { flex:1; min-width:240px; }
progress { width:100%; height:14px; }
body.role-viewer .need-operator, body.role-viewer .need-admin, body.role-operator .need-admin { display:none !important; }
h4 { margin:18px 0 4px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div id="front" class="front" hidden></div>
<div id="app" hidden>
<header><h1>better-backup</h1><span id="version" class="offline"></span><button id="recovery" class="need-operator">Bare-metal recovery</button><button id="vmware" class="need-admin">VMware servers</button><button id="m365" class="need-admin">Microsoft 365</button><button id="offsite" class="need-operator">Offsite copy</button><button id="alerts" class="need-admin">Alerts and reports</button><button id="users" class="need-admin">Users</button><button id="activity" class="need-admin">Activity log</button><button id="settings" class="need-admin">Settings</button><span id="whoami"></span><button id="account">My password</button><button id="logout">Sign out</button></header>
<main>
  <div class="banner need-admin" id="keyBanner" hidden><span><b>Keep a copy of the repository key.</b> Without it, neither the backups on this server nor the offsite copy can be read. Download it and keep it somewhere other than this server.</span><button class="primary" id="keyBannerBtn">Download the key</button></div>
  <section><h2><span>Health</span><span id="healthState" style="flex:none;white-space:nowrap"></span></h2><ul class="issues" id="issues" hidden></ul><div class="scroll" id="health"></div></section>
  <section><h2><span>Repository</span><button id="runVerify" class="need-operator">Verify all data</button><button id="runGC" class="need-operator">Reclaim space</button></h2><div class="stats" id="stats"></div><div class="usage" id="usage" hidden></div></section>
  <section><h2><span>Agents</span><button id="newToken" class="need-operator">Add an agent</button></h2><div class="scroll" id="agents"></div></section>
  <section><h2><span>Backup policies</span><button id="newPolicy" class="need-operator">New policy</button></h2><div class="scroll" id="policies"></div></section>
  <section><h2><span>Recent jobs</span><button id="moreJobs">Show more</button></h2><div class="scroll" id="jobs"></div></section>
  <section><h2><span>Snapshots</span><form id="searchForm"><input id="searchBox" type="search" placeholder="Find a file by name, in every snapshot" aria-label="Find a file by name"><button>Search</button></form></h2><div class="scroll" id="snapshots"></div></section>
</main>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("bb-token") || "";
let agentNames = {};
let agentList = [];
let snapList = [];
let vmwareList = [];
let m365List = [];
let jobLimit = 15;
let me = null; // the signed-in user

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error("You are signed out. Sign in again."); }
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
function size(n) { const u = ["B","KiB","MiB","GiB","TiB","PiB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; }
function when(t) { return t && !t.startsWith("0001") ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "never"; }
// el builds DOM nodes with textContent only, so server data is never parsed as HTML.
function el(tag, props, ...kids) { const e = Object.assign(document.createElement(tag), props || {}); for (const k of kids) e.append(k); return e; }
function table(target, heads, rows, empty) {
  const box = $(target); box.replaceChildren();
  if (!rows.length) { box.append(el("div", { className: "empty", textContent: empty })); return; }
  const t = el("table", null, el("tr", null, ...heads.map(h => el("th", { textContent: h }))));
  for (const row of rows) t.append(el("tr", null, ...row.map(c => c instanceof Node ? el("td", null, c) : el("td", { textContent: c == null ? "" : String(c) }))));
  box.append(t);
}
function pill(s) { return el("span", { className: "pill " + s, textContent: s }); }
function button(label, fn) { const b = el("button", { textContent: label }); b.onclick = () => fn().catch(e => notice("Something went wrong", e.message)); return b; }
function notice(title, text) {
  openDialog(false, el("h3", { textContent: title }), el("pre", { textContent: text }), el("div", { className: "row" }, el("button", { textContent: "Close", onclick: () => $("dlg").close() })));
}

async function refresh() {
  const [st, allAgents, policies, jobs, snaps, off, vmw, health, m365] = await Promise.all([
    call("GET", "/api/v1/status"), call("GET", "/api/v1/agents"), call("GET", "/api/v1/policies"),
    call("GET", "/api/v1/jobs?limit=" + jobLimit), call("GET", "/api/v1/snapshots"), call("GET", "/api/v1/offsite"), call("GET", "/api/v1/vmware-servers"), call("GET", "/api/v1/health"), call("GET", "/api/v1/m365-tenants")]);
  m365List = m365;
  showHealth(health);
  vmwareList = vmw;
  $("version").textContent = "version " + st.version;
  $("keyBanner").hidden = st.key_saved;
  agentNames = Object.fromEntries(allAgents.map(a => [a.id, a.name]));
  const agents = allAgents.filter(a => !a.recovery); // machines at the recovery disc are not machines to back up
  agentList = agents;
  snapList = snaps;
  const stat = (v, label) => el("div", { className: "stat" }, el("b", { textContent: v }), el("small", { textContent: label }));
  $("stats").replaceChildren(stat(st.agents, "agents"), stat(st.snapshots, "snapshots"), stat(size(st.stored_bytes), "used on disk"),
    stat(size(st.raw_bytes), "unique data before compression"), stat(st.running_jobs, "jobs running"),
    stat(offsiteSummary(off), "offsite copy"), stat(health.disk.known ? size(health.disk.free) : "unknown", "free on the repository's disk"));
  table("agents", ["Name", "Host", "System", "Version", "State", "Last seen", ""],
    agents.map(a => [a.name, a.hostname, a.os + "/" + a.arch, a.version, pill(a.revoked ? "revoked" : a.online ? "online" : "offline"), when(a.last_seen),
      a.revoked || !can("operator") ? "" : confirmButton("Revoke", "Click again to block " + a.name, async () => { await call("DELETE", "/api/v1/agents/" + a.id); await refresh(); })]),
    "No agents yet. Choose “Add an agent” to enroll the first machine.");
  table("policies", ["Name", "Agent", "Paths", "Schedule", "Keeps", ""],
    policies.map(p => [p.name, agentNames[p.agent_id] || p.agent_id, (p.paths || []).concat((p.volumes || []).map(v => v + " (image)"), (p.vms || []).map(v => v === "*" ? "all virtual machines" : v + " (VM)"), p.system_state ? ["system state"] : [], p.truenas_config ? ["TrueNAS configuration"] : [], p.bare_metal ? ["whole machine"] : [], p.m365 ? [m365Summary(p.m365)] : []).join(", "),
      (p.schedule.interval ? "every " + p.schedule.interval : p.schedule.daily_at ? "daily at " + p.schedule.daily_at : "manual") + (p.enabled ? "" : " (paused)"),
      keeps(p.retention),
      el("div", { className: "acts need-operator" },
        button("Back up now", async () => { await call("POST", "/api/v1/policies/" + p.id + "/run"); await refresh(); }),
        button("Edit", async () => policyDialog(p)))]),
    "No policies yet. Choose “New policy” to say what to back up and when.");
  table("jobs", ["Started", "Type", "Agent", "Status", "Detail", ""],
    jobs.map(j => [when(j.created), j.type, agentNames[j.agent_id] || "server", pill(j.status),
      j.error || (j.warnings ? j.warnings.length + " warnings" : "") || (j.snapshot_id ? "snapshot " + j.snapshot_id : ""),
      el("div", { className: "acts" }, button("Details", async () => jobDialog(j.id)), cancelButton(j, refresh))]),
    "No jobs have run yet.");
  table("snapshots", ["Time", "Host", "Paths", "Files", "Size", "New data", ""],
    snaps.slice(0, 50).map(s => [when(s.time), s.hostname, s.sources.map(x => x.name).join(", "), s.stats.files, size(s.stats.bytes), size(s.stats.bytes_uploaded),
      el("div", { className: "acts" }, button("Browse", async () => browseDialog(s, "")), can("operator") ? button("Restore", async () => restoreDialog(s, "")) : "")]),
    "No snapshots yet.");
}

const stateNames = { ok: "protected", warning: "warnings", failed: "failed", overdue: "overdue", never: "no backup yet", running: "running", paused: "manual" };
function day(t) { return t ? new Date(t).toLocaleDateString([], { dateStyle: "medium" }) : "never"; }
// showHealth fills the health section: the verdict, what needs attention, every policy, and how the repository grows.
function showHealth(h) {
  const verdict = { ok: "Everything is protected", warning: "Needs a look", failed: "Needs attention" }[h.state];
  $("healthState").replaceChildren(el("span", { className: "pill " + (h.state === "ok" ? "success" : h.state), id: "verdict", textContent: verdict }));
  $("issues").hidden = !h.issues.length;
  $("issues").replaceChildren(...h.issues.map(i => el("li", { className: i.level, textContent: i.text })));
  table("health", ["Machine", "Policy", "State", "Last good backup", "Size", "New in 7 days", "Snapshots"],
    h.policies.map(p => [p.agent, p.policy, Object.assign(el("span", { className: "pill " + p.state, textContent: stateNames[p.state] || p.state }), { title: p.detail || "" }),
      when(p.last_good || ""), size(p.size), size(p.new_7_days), p.snapshots]),
    "No backup policies yet.");
  const parts = [];
  if (h.growth_per_day > 0) parts.push("Grows by about " + size(h.growth_per_day) + " a day" + (h.days_left ? ", so the disk lasts about " + (h.days_left > 730 ? "more than two years" : h.days_left + " days") : "") + ".");
  else if (h.usage.length > 1) parts.push("Not growing.");
  parts.push(h.last_verify ? "All data was checked and found good on " + day(h.last_verify) + "." : "All data has not been checked yet.");
  if (h.next_verify) parts.push("Next check: " + day(h.next_verify) + ".");
  const box = $("usage"); box.hidden = false; box.replaceChildren();
  if (h.usage.length > 1) {
    const ns = "http://www.w3.org/2000/svg", w = 220, ht = 44;
    const max = Math.max(...h.usage.map(u => u.stored), 1), min = Math.min(...h.usage.map(u => u.stored));
    const span = Math.max(max - min, max * 0.02, 1);
    const pts = h.usage.map((u, i) => (i * (w - 4) / (h.usage.length - 1) + 2).toFixed(1) + "," + (ht - 3 - (u.stored - min) / span * (ht - 6)).toFixed(1)).join(" ");
    const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + w + " " + ht); svg.setAttribute("role", "img");
    const title = document.createElementNS(ns, "title"); title.textContent = "Space used over the last " + h.usage.length + " days, from " + size(h.usage[0].stored) + " to " + size(h.usage[h.usage.length - 1].stored);
    const line = document.createElementNS(ns, "polyline"); line.setAttribute("points", pts); line.setAttribute("fill", "none"); line.setAttribute("stroke", "currentColor"); line.setAttribute("stroke-width", "2"); line.setAttribute("stroke-linejoin", "round");
    svg.style.color = "var(--accent)"; svg.append(title, line); box.append(svg);
  }
  box.append(el("span", { id: "usageText", textContent: parts.join(" ") }));
}
// cancelButton stops a job that is waiting or running.
function cancelButton(j, after) {
  if (!can("operator") || (j.status !== "queued" && j.status !== "running") || (j.status === "running" && (j.type === "gc" || j.type === "verify"))) return "";
  return confirmButton("Cancel", "Click again to stop it", async () => { await call("POST", "/api/v1/jobs/" + j.id + "/cancel"); await after(); });
}

function keeps(r) {
  const parts = [["keep_last", "last"], ["keep_daily", "daily"], ["keep_weekly", "weekly"], ["keep_monthly", "monthly"], ["keep_yearly", "yearly"]]
    .filter(([k]) => r && r[k]).map(([k, label]) => r[k] + " " + label);
  return parts.length ? parts.join(", ") : "everything";
}
const lines = v => v.split("\n").map(x => x.trim()).filter(Boolean);
// m365Summary says in a few words what a policy takes from Microsoft 365.
function m365Summary(m) {
  const t = m365List.find(x => x.id === m.tenant);
  const who = (m.users || []).includes("*") ? "everyone" : (m.users || []).length === 1 ? m.users[0] : (m.users || []).length + " users";
  return "Microsoft 365 " + [m.mail ? "mail" : "", m.onedrive ? "OneDrive" : ""].filter(Boolean).join(" and ") + " of " + who + (t ? " at " + t.name : "");
}

// policyDialog creates a policy, or edits p when one is given.
function policyDialog(p) {
  const active = agentList.filter(a => !a.revoked || (p && a.id === p.agent_id));
  if (!active.length) { notice("Add an agent first", "A policy backs up one machine, so enroll an agent before creating a policy."); return; }
  const name = el("input", { value: p ? p.name : "", placeholder: "For example: File server documents" });
  const agent = el("select", null, ...active.map(a => el("option", { value: a.id, textContent: a.name + " (" + a.os + ")" })));
  if (p) agent.value = p.agent_id;
  const paths = el("textarea", { rows: 3, value: p ? (p.paths || []).join("\n") : "", placeholder: "One folder or file per line, for example D:\\Shares or /home" });
  const excludes = el("textarea", { rows: 2, value: p && p.excludes ? p.excludes.join("\n") : "", placeholder: "One pattern per line, for example *.tmp or node_modules" });
  const volumes = el("textarea", { rows: 2, value: p && p.volumes ? p.volumes.join("\n") : "", placeholder: "One per line, for example C: on Windows, /dev/vg0/data on Linux or /dev/zvol/tank/vm-disk on TrueNAS" });
  const vms = el("textarea", { rows: 2, value: p && p.vms ? p.vms.join("\n") : "", placeholder: "One name per line, or * for every machine on the host" });
  const kind = el("select", null, el("option", { value: "daily", textContent: "Every day at a set time" }),
    el("option", { value: "interval", textContent: "Repeating, every so often" }), el("option", { value: "manual", textContent: "Only when started by hand" }));
  const at = el("input", { type: "time", value: p && p.schedule.daily_at ? p.schedule.daily_at : "02:00" });
  const every = el("input", { value: p && p.schedule.interval ? p.schedule.interval : "6h", placeholder: "Such as 30m, 6h or 24h" });
  kind.value = !p ? "daily" : p.schedule.interval ? "interval" : p.schedule.daily_at ? "daily" : "manual";
  const show = () => { at.hidden = kind.value !== "daily"; every.hidden = kind.value !== "interval"; };
  kind.onchange = show; show();
  const r = (p && p.retention) || (p ? {} : { keep_daily: 14, keep_weekly: 8, keep_monthly: 12 });
  const keep = {};
  const grid = el("div", { className: "grid" }, ...[["keep_last", "Most recent"], ["keep_daily", "Daily"], ["keep_weekly", "Weekly"], ["keep_monthly", "Monthly"], ["keep_yearly", "Yearly"]].map(([k, label]) => {
    keep[k] = el("input", { type: "number", min: 0, value: r[k] || "", placeholder: "0" });
    return el("div", null, keep[k], el("small", { textContent: label }));
  }));
  const enabled = el("input", { type: "checkbox", checked: p ? p.enabled : true });
  const noSnap = el("input", { type: "checkbox", checked: p ? !!p.no_snapshot : false });
  const sysState = el("input", { type: "checkbox", id: "sysState", checked: p ? !!p.system_state : false });
  const bareMetal = el("input", { type: "checkbox", id: "bareMetal", checked: p ? !!p.bare_metal : false });

function signOut() {

let timer;
async function start() {
  me = await pub("GET", "/api/v1/me");
  document.body.className = "role-" + me.role;
  $("whoami").textContent = me.token ? "admin token" : me.name + " (" + roleNames[me.role].toLowerCase() + ")";
  $("account").hidden = !!me.token;
  $("front").hidden = true; $("app").hidden = false;
  refresh().catch(() => {});
  clearInterval(timer); timer = setInterval(() => { if (token && !$("dlg").open) refresh().catch(() => {}); }, 5000);
}

// boot decides which page to show: recovery progress, the key prompt,
// first-run setup, sign-in, or the app.
async function boot(waiting) {
  let st;
  try { st = await pub("GET", "/api/v1/setup"); }
  catch (e) {
    // The server is restarting, or cannot be reached.
    if (waiting) { clearTimeout(recoverTimer); recoverTimer = setTimeout(() => boot(true), 2000); return; }
    front(el("h1", { textContent: "better-backup" }), el("div", { className: "msg", textContent: "The server cannot be reached: " + e.message }),
      el("div", { className: "row" }, el("button", { textContent: "Try again", onclick: () => boot() })));
    return;
  }
  if (st.recovery) return recoverProgress(st);
  if (st.locked) {
    if (st.locked_needs_sign_in && !token) return loginPage("This server is waiting for its repository key. Sign in as an administrator to enter it.");
    return lockedPage();
  }
  if (token) {
    try { await start(); return; } catch (e) { token = ""; sessionStorage.removeItem("bb-token"); }
  }
  if (st.needs_setup) return setupPage(st, waiting ? "The server is ready, but what it recovered held no users. Create the first administrator." : "");
  loginPage(waiting ? "The server is back. Sign in with your name and password from the old server." : "");
}

// download saves text as a file from the browser.
function download(name, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "application/octet-stream" })), download: name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// indexSays puts the state of the index of file names into words.
function indexSays(ix) {
  const n = ix.names.toLocaleString() + (ix.names === 1 ? " file or folder name" : " file and folder names");
  if (ix.state === "off") return "The index could not be opened, so searches read the snapshots themselves, which is slow. " + (ix.error || "");
  if (ix.state === "building") return "Being built: " + (ix.snapshots - ix.waiting) + " of " + ix.snapshots + " snapshots are in it so far (" + n + ", " + size(ix.bytes) + "). Until it is done, searches read the snapshots themselves, which is slower." + (ix.error ? " It stopped on a problem and tries again by itself: " + ix.error : "");
  return "Up to date: " + n + " from " + ix.snapshots + (ix.snapshots === 1 ? " snapshot" : " snapshots") + ", using " + size(ix.bytes) + " in the data folder." +
    (ix.waiting ? " " + ix.waiting + (ix.waiting === 1 ? " new snapshot is" : " new snapshots are") + " being added." : "") + (ix.error ? " It stopped on a problem and tries again by itself: " + ix.error : "");
}

    el("label", { className: "check" }, active, "May sign in"), msg, buttons);
}
$("users").onclick = () => usersDialog().catch(e => notice("Something went wrong", e.message));

function passwordDialog() {
  const old = el("input", { id: "oldPassword", type: "password", autocomplete: "current-password" });
  const pass = el("input", { id: "newPassword", type: "password", autocomplete: "new-password", placeholder: "At least 10 characters" });
  const again = el("input", { id: "newPassword2", type: "password", autocomplete: "new-password" });
  const msg = el("div", { className: "msg", id: "err" });
  const save = el("button", { className: "primary", id: "savePassword", textContent: "Change the password" });
  save.onclick = async () => {
    if (pass.value !== again.value) { msg.textContent = "The two new passwords differ."; return; }
    try { await call("PUT", "/api/v1/me/password", { old: old.value, new: pass.value }); notice("Password changed", "Your other sign-ins, on other computers or browsers, have ended."); } catch (e) { msg.textContent = e.message; }
  };
  openDialog(false, el("h3", { textContent: "Change your password" }), el("label", { textContent: "Current password" }), old, el("label", { textContent: "New password" }), pass,
    el("label", { textContent: "New password again" }), again, msg, el("div", { className: "row" }, el("button", { textContent: "Cancel", onclick: () => $("dlg").close() }), save));
}
$("account").onclick = passwordDialog;

async function activityDialog() {
  let entries = await call("GET", "/api/v1/audit?limit=100");
  const t = el("table", { id: "auditTable" }, el("tr", null, ...["When", "Who", "From", "What", "Detail"].map(h => el("th", { textContent: h }))));
  const add = list => { for (const e of list) t.append(el("tr", null, el("td", { textContent: when(e.time) }), el("td", { textContent: e.user }), el("td", { textContent: e.remote || "" }), el("td", { textContent: e.action }), el("td", { className: "wrap", style: "word-break:break-word", textContent: e.detail || "" }))); };
  add(entries);
  const more = el("button", { textContent: "Show older", style: "margin-right:auto" });
  more.hidden = entries.length < 100;
  more.onclick = async () => {
    try { const older = await call("GET", "/api/v1/audit?limit=100&before=" + entries[entries.length - 1].id); add(older); entries = entries.concat(older); more.hidden = older.length < 100; } catch (e) { notice("Something went wrong", e.message); }
  };
  openDialog(true, el("h3", { textContent: "Activity log" }),
    el("div", { className: "hint", textContent: "Who signed in and who changed or started what, newest first. Kept for two years." }),
    el("div", { className: "list", style: "margin-top:10px" }, entries.length ? t : el("div", { className: "empty", textContent: "Nothing yet." })),
    el("div", { className: "row" }, more, el("button", { textContent: "Close", onclick: () => $("dlg").close() })));
}
$("activity").onclick = () => activityDialog().catch(e => notice("Something went wrong", e.message));

boot();
</script>
</body>
</html>
