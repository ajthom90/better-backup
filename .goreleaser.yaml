version: 2
project_name: better-backup

before:
  hooks:
    - go mod download

builds:
  - id: bb-server
    main: ./cmd/bb-server
    binary: bb-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/ajthom90/better-backup/internal/server.Version={{ .Version }}
      - -X github.com/ajthom90/better-backup/internal/agent.Version={{ .Version }}
  - id: bb
    main: ./cmd/bb
    binary: bb
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: bb-agent
    main: ./cmd/bb-agent
    binary: bb-agent
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags

# The Mac programs in the archives are signed with the Developer ID
# Application certificate (hardened runtime) and notarized by Apple, when
# the release workflow has the secrets for it (see
# packaging/macos/ci-signing.sh for the list); otherwise they stay
# unsigned. This works on Linux. A bare program cannot carry a stapled
# ticket: a Mac asks Apple about it the first time it runs.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_APP_CERT_P12") (isEnvSet "APPLE_API_KEY_P8") }}'
      ids: [bb-server, bb, bb-agent]
      sign:
        certificate: "{{ .Env.MACOS_APP_CERT_P12 }}"
        password: "{{ .Env.MACOS_CERT_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPLE_API_ISSUER_ID }}"
        key_id: "{{ .Env.APPLE_API_KEY_ID }}"
        key: "{{ .Env.APPLE_API_KEY_P8 }}"
        wait: true
        timeout: 20m

archives:
  - id: server
    ids: [bb-server, bb]
    name_template: "better-backup-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
  - id: agent
    ids: [bb-agent]
    name_template: "better-backup-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

nfpms:
  - id: server
    package_name: better-backup-server
    ids: [bb-server, bb]
    formats: [deb, rpm]
    maintainer: better-backup contributors
    description: better-backup server. Stores deduplicated, encrypted backups and coordinates agents.
    homepage: https://github.com/ajthom90/better-backup
    license: Apache-2.0
    contents:
      - src: packaging/systemd/better-backup-server.service
        dst: /usr/lib/systemd/system/better-backup-server.service
    scripts:
      postinstall: packaging/scripts/postinstall-server.sh
      preremove: packaging/scripts/preremove-server.sh
  - id: agent
    package_name: better-backup-agent
    ids: [bb-agent]
    formats: [deb, rpm]
    maintainer: better-backup contributors
    description: better-backup agent. Backs up and restores this machine.
    homepage: https://github.com/ajthom90/better-backup
    license: Apache-2.0
    contents:
      - src: packaging/systemd/better-backup-agent.service
        dst: /usr/lib/systemd/system/better-backup-agent.service
    scripts:
      postinstall: packaging/scripts/postinstall-agent.sh
      preremove: packaging/scripts/preremove-agent.sh

# Builds that are not a release (CI, and the Docker workflow's "edge"
# packages) are numbered by BB_SNAPSHOT_VERSION when it is set: the
# workflows pass what "go run ./internal/tools/release version" prints, such as
# 0.1.1-edge.12. In a .deb or .rpm that is version 0.1.1~edge.12, which
# the package managers sort before 0.1.1.
snapshot:
  version_template: '{{ envOrDefault "BB_SNAPSHOT_VERSION" (print .Version "-SNAPSHOT-" .ShortCommit) }}'

checksum:
  name_template: checksums.txt

# The release notes come from CHANGELOG.md and changelog.d, and the
# release workflow publishes the release itself, with the installers
# built on other machines: see .github/workflows/release.yml.
changelog:
  disable: true
