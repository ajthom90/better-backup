name: Docker

# Publishes the images from every commit on main to ghcr.io, tagged
# "edge" and with the commit id. Releases (version tags) are published by
# release.yml as the version and "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:sha-${{ steps.v.outputs.sha }}
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ steps.v.outputs.sha }}
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}-agent:edge
            ghcr.io/${{ github.repository }}-agent:sha-${{ steps.v.outputs.sha }}
