name: Docker

# The "edge" channel: every commit on main is built, numbered (such as
# 0.1.1-edge.12: the twelfth commit after release 0.1.0) and published
#   - as images on ghcr.io, tagged "edge", with that version and with the
#     commit id, and
#   - as the GitHub pre-release "edge", which holds the installers and
#     what changed since the last release. It is replaced by each build.
#     Servers that follow the edge channel read it to learn of a newer
#     build.
# Releases are published by release.yml. docs/versioning.md has the
# whole policy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # replace the "edge" pre-release
  packages: write # push images to ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    # One version for everything this run builds.
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is counted from the last release
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: v
        run: |
          version="$(go run ./internal/tools/release version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"

  msi:
    # The Windows installers, for x64 and ARM64. The server image
    # carries the agent's, and the Linux and macOS ones below, so that
    # its web UI can hand them out and agents can update from it.
    name: Windows installers
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ${{ needs.version.outputs.version }} -Arch amd64,arm64
      - uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-installers
          path: dist/*.msi
          retention-days: 30

  packages:
    # The Linux packages (.deb and .rpm, x64 and ARM64), numbered like
    # the Windows installers.
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          BB_SNAPSHOT_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: better-backup-linux-agent-packages
          path: |
            dist/better-backup-*.deb
            dist/better-backup-*.rpm
          if-no-files-found: error
          retention-days: 30

  pkg:
    # The macOS installers of the agent and the server, each one for
    # Intel and Apple silicon. They are
    # signed, notarized and stapled when the repository has the secrets
    # that packaging/macos/ci-signing.sh lists, and unsigned otherwise.
    name: macOS installers
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up signing
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/ci-signing.sh
      - name: Build
        run: |
          packaging/macos/build.sh "${{ needs.version.outputs.version }}" dist
          packaging/macos/build-server.sh "${{ needs.version.outputs.version }}" dist "$(ls dist/better-backup-agent_*.pkg)"
      - uses: actions/upload-artifact@v4
        with:
          name: better-backup-macos-agent-installer
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 30

  images:
    # Only main publishes. A run started by hand on another branch stops
    # after the installers, which is how to try them (and their signing)
    # before a merge.
    if: github.ref == 'refs/heads/main'
    needs: [version, msi, packages, pkg]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch the Windows installers
        uses: actions/download-artifact@v4
        with:
          name: better-backup-windows-installers
          path: dist
      - name: Fetch the Linux packages
        uses: actions/download-artifact@v4
        with:
          name: better-backup-linux-agent-packages
          path: dist
      - name: Fetch the macOS installer
        uses: actions/download-artifact@v4
        with:
          name: better-backup-macos-agent-installer
          path: dist
      - name: Put the agent installers in the server image
        run: |
          cp dist/better-backup-agent_*.msi dist/better-backup-agent_*.deb dist/better-backup-agent_*.rpm dist/better-backup-agent_*.pkg packaging/installers/
          ls -l packaging/installers/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: What changed since the last release
        run: |
          {
            echo "A build from the main branch, version **$VERSION** (commit ${GITHUB_SHA::12}). It is replaced by every change to main and may break: use it on a test server. The container images are tagged \`edge\`."
            echo
            echo "## What changed since the last release"
            echo
            go run ./internal/tools/release notes
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.v.outputs.sha }}
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}-agent:edge
            ghcr.io/${{ github.repository }}-agent:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}-agent:sha-${{ steps.v.outputs.sha }}
      - name: Replace the "edge" pre-release
        # After the images, so that a server told of this build finds its
        # image. The release is named after the version: that is how a
        # server reads which build it is. It is never marked "latest".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum better-backup-* > SHA256SUMS
          gh release delete edge --yes --cleanup-tag || true
          # The tag takes a moment to go.
          sleep 5
          gh release create edge --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" better-backup-* SHA256SUMS
