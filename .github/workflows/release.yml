name: Release

# Runs when a version tag such as v0.1.0 is pushed: builds archives and
# .deb/.rpm packages for every platform, attaches them to a GitHub
# release, and publishes the Docker images to ghcr.io. A second job
# builds the macOS installer on a Mac and adds it to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push images to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-agent:latest

  macos:
    # The macOS installer: bb-agent, its launchd daemon and the app.
    #
    # It is signed and notarized when the repository has these secrets,
    # and otherwise built unsigned (it installs, but macOS warns):
    #   MACOS_CERTIFICATES_P12       base64 of a .p12 holding the Developer ID
    #                                Application and Developer ID Installer
    #                                certificates with their keys
    #   MACOS_CERTIFICATES_PASSWORD  the password of that .p12
    #   MACOS_SIGN_APP               "Developer ID Application: NAME (TEAM)"
    #   MACOS_SIGN_PKG               "Developer ID Installer: NAME (TEAM)"
    #   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
    #                                an Apple ID, its team, and an
    #                                app-specific password, for notarization
    name: macOS installer
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import the signing certificates
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing certificates: building an unsigned installer."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "SIGNING=1" >> "$GITHUB_ENV"
      - name: Build the installer
        env:
          SIGN_APP: ${{ secrets.MACOS_SIGN_APP }}
          SIGN_PKG: ${{ secrets.MACOS_SIGN_PKG }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -n "$SIGNING" ]; then
            export MACOS_SIGN_APP="$SIGN_APP" MACOS_SIGN_PKG="$SIGN_PKG"
          fi
          packaging/macos/build.sh "${{ github.ref_name }}" dist
          cd dist
          for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.pkg dist/*.pkg.sha256 --clobber
