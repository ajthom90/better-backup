name: Release

# Runs when a version tag such as v0.1.0 is pushed: builds archives and
# .deb/.rpm packages for every platform, attaches them to a GitHub
# release, and publishes the Docker images to ghcr.io. Two more jobs
# build the macOS installer on a Mac and the Windows installers on
# Windows, and add them to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push images to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs and notarizes the Mac programs in the archives, when
          # these are set: see "notarize" in .goreleaser.yaml.
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Recovery disc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso mtools grub-pc-bin grub-common \
            grub-efi-amd64-signed shim-signed kmod zstd busybox-static cpio file
          out="$RUNNER_TEMP/recovery"
          flags="-s -w -X github.com/ajthom90/better-backup/internal/server.Version=$GITHUB_REF_NAME -X github.com/ajthom90/better-backup/internal/agent.Version=$GITHUB_REF_NAME"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o "$out/bb-agent" ./cmd/bb-agent
          python3 packaging/recovery/build.py --agent "$out/bb-agent" --out "$out/better-backup-recovery.iso" --firmware --version "$GITHUB_REF_NAME"
          # And the disc for ARM64 machines.
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$flags" -o "$out/arm64/bb-agent" ./cmd/bb-agent
          python3 packaging/recovery/build.py --arch arm64 --agent "$out/arm64/bb-agent" --out "$out/better-backup-recovery-arm64.iso" --firmware --version "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$out/better-backup-recovery.iso" "$out/better-backup-recovery-arm64.iso" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-agent:latest

  macos:
    # The macOS installer: bb-agent, its launchd daemon and the app.
    #
    # It is signed, notarized and stapled when the repository has the
    # secrets that packaging/macos/ci-signing.sh lists, and otherwise
    # built unsigned (it installs, but macOS warns).
    name: macOS installer
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up signing
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/ci-signing.sh
      - name: Build the installer
        run: |
          packaging/macos/build.sh "${{ github.ref_name }}" dist
          cd dist
          for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.pkg dist/*.pkg.sha256 --clobber

  msi:
    # Windows installers, added to the release made above. They are
    # signed when the repository has the secrets SIGN_PFX_BASE64 (a code
    # signing certificate as a base64 PFX) and SIGN_PFX_PASSWORD.
    name: Windows installers
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          ./packaging/windows/build.ps1 -Version ${{ github.ref_name }} -Arch amd64,arm64
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} (Get-ChildItem dist/*.msi).FullName --clobber
