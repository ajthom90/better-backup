name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  kvm:
    # Backs up and restores real virtual machines: through libvirt, and
    # as Proxmox VE runs them (a bare QEMU, with stand-ins for Proxmox's
    # own tools). Full, by change tracking, switched off, and restored
    # as new machines.
    name: KVM (libvirt, Proxmox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install QEMU and libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients ovmf
          # Let QEMU use the runner's hardware virtualization.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo systemctl restart libvirtd
          sudo virsh -c qemu:///system version
      - name: Test
        run: |
          go test -c -o /tmp/server.test ./internal/server/
          go test -c -o /tmp/qemuimg.test ./internal/qemuimg/
          go test -c -o /tmp/proxmox.test ./internal/proxmox/
          sudo /tmp/qemuimg.test -test.v
          sudo /tmp/proxmox.test -test.v
          cd internal/server
          sudo env BB_TEST_LIBVIRT=/var/lib/libvirt/images /tmp/server.test -test.v -test.run 'TestLibvirt|TestProxmox'

  msi:
    # Builds the Windows installers and uses them for real: installs the
    # server, enrolls an agent from an enrollment code, upgrades both and
    # removes them.
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build two versions
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -Version 0.0.0
          ./packaging/windows/build.ps1 -Version 0.0.${{ github.run_number }}
      - name: Install, enroll, upgrade, remove
        shell: pwsh
        run: ./packaging/windows/test.ps1 -Dir dist -Old 0.0.0 -New 0.0.${{ github.run_number }}
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-installers
          path: dist/*_0.0.${{ github.run_number }}_windows_amd64.msi
          retention-days: 30
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: dist/*.log
          retention-days: 7

  build:
    name: Lint, cross-compile, Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build every target
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go vet ./...
            done
          done
      - name: Build test binaries
        run: |
          v="ci-$(git rev-parse --short=12 HEAD)"
          flags="-s -w -X github.com/ajthom90/better-backup/internal/server.Version=$v -X github.com/ajthom90/better-backup/internal/agent.Version=$v"
          for target in windows/amd64 linux/amd64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags "$flags" -o "dist/${target%/*}-${target#*/}/" ./cmd/...
          done
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-amd64
          path: dist/windows-amd64/
          retention-days: 30
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-linux-amd64
          path: dist/linux-amd64/
          retention-days: 30
      - name: Build the Docker images
        run: |
          docker build --target server -t better-backup:ci .
          docker build --target agent -t better-backup-agent:ci .
      - name: Start the server image
        run: |
          docker run -d --name bb better-backup:ci
          for i in $(seq 1 30); do
            if docker exec bb bb status; then exit 0; fi
            sleep 1
          done
          docker logs bb
          exit 1
