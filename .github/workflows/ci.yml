name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  build:
    name: Lint, cross-compile, Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build every target
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go vet ./...
            done
          done
      - name: Build the Docker images
        run: |
          docker build --target server -t better-backup:ci .
          docker build --target agent -t better-backup-agent:ci .
      - name: Start the server image
        run: |
          docker run -d --name bb better-backup:ci
          for i in $(seq 1 30); do
            if docker exec bb bb status; then exit 0; fi
            sleep 1
          done
          docker logs bb
          exit 1
