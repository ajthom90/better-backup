name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 and ARM64 of each system. On Windows the tests run
        # elevated, so the ARM64 runner also takes real VSS snapshots.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Processor
        shell: bash
        run: go env GOOS GOARCH && uname -m
      - name: Vet
        run: go vet ./...
      - name: Test
        # Go has no race detector for Windows on ARM64.
        run: go test ${{ matrix.os != 'windows-11-arm' && '-race' || '' }} -count=1 ./...

  recovery:
    name: Recovery disc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the disc and emulator tools
        timeout-minutes: 10
        run: |
          # The runner's regional mirror is sometimes very slow; the main
          # archive is not.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends xorriso mtools grub-pc-bin grub-common grub-efi-amd64-bin \
            grub-efi-amd64-signed shim-signed kmod zstd busybox-static cpio file gdisk fdisk e2fsprogs \
            qemu-system-x86 ovmf
          # Let the emulator use hardware virtualization where the runner has it.
          sudo chmod 666 /dev/kvm || true
      - name: Keep the downloaded kernel packages
        uses: actions/cache@v4
        with:
          path: bin/recovery-cache
          key: recovery-packages-${{ hashFiles('packaging/recovery/build.py') }}
      - name: Build the recovery disc
        timeout-minutes: 10
        run: make recovery VERSION="ci-$(git rev-parse --short=12 HEAD)"
      - name: Recover a machine in an emulator (UEFI and BIOS)
        timeout-minutes: 15
        run: BB_RECOVERY_ISO="$PWD/bin/recovery.iso" go test -count=1 -v -timeout 14m -run TestRecoveryDisc ./internal/recovery/
      - name: Upload the recovery disc
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-recovery-iso
          path: bin/recovery.iso
          retention-days: 30

  recovery-arm64:
    # The disc for ARM64 machines, built on an ARM64 runner and used to
    # recover an emulated ARM64 machine.
    name: Recovery disc (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the disc and emulator tools
        timeout-minutes: 10
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends xorriso mtools grub-common grub-efi-arm64-bin kmod zstd busybox-static \
            cpio file gdisk fdisk e2fsprogs qemu-system-arm qemu-efi-aarch64
          sudo chmod 666 /dev/kvm || true
      - name: Keep the downloaded kernel packages
        uses: actions/cache@v4
        with:
          path: bin/recovery-cache
          key: recovery-packages-arm64-${{ hashFiles('packaging/recovery/build.py') }}
      - name: Build the recovery disc
        timeout-minutes: 10
        run: make recovery-arm64 VERSION="ci-$(git rev-parse --short=12 HEAD)"
      - name: Recover a machine in an emulator
        timeout-minutes: 40
        run: BB_RECOVERY_ISO_ARM64="$PWD/bin/recovery-arm64.iso" go test -count=1 -v -timeout 38m -run TestRecoveryDiscARM64 ./internal/recovery/
      - name: Upload the recovery disc
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-recovery-arm64-iso
          path: bin/recovery-arm64.iso
          retention-days: 30

  zfs:
    name: ZFS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create a ZFS pool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux
          sudo modprobe zfs
          truncate -s 2G /tmp/pool.img
          sudo zpool create bbtest /tmp/pool.img
      - name: Back up and restore datasets and a volume
        run: |
          go test -c -o server.test ./internal/server
          sudo BB_TEST_ZPOOL=bbtest ./server.test -test.run TestZFS -test.v
      - name: Kernel log
        if: failure()
        run: |
          zfs version || true
          sudo dmesg | tail -n 120

  kvm:
    # Backs up and restores real virtual machines: through libvirt, and
    # as Proxmox VE runs them (a bare QEMU, with stand-ins for Proxmox's
    # own tools). Full, by change tracking, switched off, and restored
    # as new machines.
    name: KVM (libvirt, Proxmox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install QEMU and libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients ovmf
          # Let QEMU use the runner's hardware virtualization.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo systemctl restart libvirtd
          sudo virsh -c qemu:///system version
      - name: Test
        run: |
          go test -c -o /tmp/server.test ./internal/server/
          go test -c -o /tmp/qemuimg.test ./internal/qemuimg/
          go test -c -o /tmp/proxmox.test ./internal/proxmox/
          sudo /tmp/qemuimg.test -test.v
          sudo /tmp/proxmox.test -test.v
          cd internal/server
          sudo env BB_TEST_LIBVIRT=/var/lib/libvirt/images /tmp/server.test -test.v -test.run 'TestLibvirt|TestProxmox'

  msi-build:
    # Builds the Windows installers for x64 and ARM64 the way a release
    # does: both on an x64 runner.
    name: Windows installers (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build two versions
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -Version 0.0.0 -Arch amd64,arm64
          ./packaging/windows/build.ps1 -Version 0.0.${{ github.run_number }} -Arch amd64,arm64
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-installers
          path: dist/*_0.0.${{ github.run_number }}_windows_*.msi
          retention-days: 30
      - name: Hand both versions to the tests
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-for-tests
          path: dist/*.msi
          retention-days: 1

  msi:
    # Uses the installers for real, on an x64 and on an ARM64 Windows:
    # installs the server, enrolls an agent from an enrollment code,
    # upgrades both and removes them.
    name: Windows installers (${{ matrix.arch }})
    needs: msi-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: amd64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers-for-tests
          path: dist
      - name: Install, enroll, upgrade, remove
        shell: pwsh
        run: ./packaging/windows/test.ps1 -Dir dist -Old 0.0.0 -New 0.0.${{ github.run_number }} -Arch ${{ matrix.arch }} -BothAgents
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ matrix.arch }}
          path: dist/*.log
          retention-days: 7

  build:
    name: Lint, cross-compile, Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build every target
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go vet ./...
            done
          done
      - name: Build test binaries
        run: |
          v="ci-$(git rev-parse --short=12 HEAD)"
          flags="-s -w -X github.com/ajthom90/better-backup/internal/server.Version=$v -X github.com/ajthom90/better-backup/internal/agent.Version=$v"
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags "$flags" -o "dist/${target%/*}-${target#*/}/" ./cmd/bb ./cmd/bb-agent ./cmd/bb-server
          done
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-amd64
          path: dist/windows-amd64/
          retention-days: 30
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-linux-amd64
          path: dist/linux-amd64/
          retention-days: 30
      - name: Upload Windows ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-windows-arm64
          path: dist/windows-arm64/
          retention-days: 30
      - name: Upload Linux ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-linux-arm64
          path: dist/linux-arm64/
          retention-days: 30
      - name: Build the Docker images
        run: |
          docker build --target server -t better-backup:ci .
          docker build --target agent -t better-backup-agent:ci .
      - name: Start the server image
        run: |
          docker run -d --name bb better-backup:ci
          for i in $(seq 1 30); do
            if docker exec bb bb status; then exit 0; fi
            sleep 1
          done
          docker logs bb
          exit 1

  docker-arm64:
    # The same images, built and started on an ARM64 machine.
    name: Docker on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The recovery disc inside the server image is put together by
      # x64 tools, which an ARM64 machine runs through an emulator.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - name: Build the Docker images
        run: |
          docker build --target server -t better-backup:ci .
          docker build --target agent -t better-backup-agent:ci .
      - name: Start the server image
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' better-backup:ci)" = arm64
          docker run --rm better-backup:ci version | grep linux/arm64
          docker run --rm better-backup-agent:ci version | grep linux/arm64
          docker run -d --name bb better-backup:ci
          for i in $(seq 1 30); do
            if docker exec bb bb status; then exit 0; fi
            sleep 1
          done
          docker logs bb
          exit 1

  linux-packages:
    # Builds the .deb and .rpm packages as a release does, then installs
    # the agent's on this runner and uses it for real: the systemd
    # service, enrollment, a backup, an upgrade, removal. Once on x64
    # and once on ARM64.
    name: Linux packages (.deb, .rpm, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the scripts
        if: matrix.arch == 'amd64'
        run: shellcheck -S error packaging/install.sh packaging/test/agent.sh packaging/test/macos-signing.sh packaging/scripts/*.sh packaging/macos/build.sh packaging/macos/ci-signing.sh packaging/macos/uninstall.sh packaging/macos/scripts/* packaging/macos/build-server.sh packaging/macos/server/uninstall.sh packaging/macos/server/scripts/* packaging/test/server-macos.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Install the agent package and use it
        run: |
          mkdir tools
          CGO_ENABLED=0 go build -o tools/ ./cmd/bb ./cmd/bb-server
          # A newer agent, for the installed one to update itself to.
          CGO_ENABLED=0 go build -ldflags "-X github.com/ajthom90/better-backup/internal/agent.Version=99.0.0" -o tools/bb-agent-next ./cmd/bb-agent
          packaging/test/agent.sh "$(ls dist/better-backup-agent_*_linux_${{ matrix.arch }}.deb)" tools
      - name: Install the .rpm on Rocky Linux
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -ec '
            rpm -i /dist/better-backup-agent_*_linux_${{ matrix.arch }}.rpm
            bb-agent version | grep linux/${{ matrix.arch }}
            test -f /usr/lib/systemd/system/better-backup-agent.service
            bb-agent status || true
            rpm -e better-backup-agent'
      - name: Build the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          make app
          go vet -tags desktop,production,webkit2_41 ./cmd/bb-agent-ui/
      - name: Upload the packages
        if: matrix.arch == 'amd64' # one run builds the packages of both
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 30

  macos-package:
    # Builds the macOS installer, installs it on this runner and uses
    # it for real: the launchd daemon, enrollment, a backup, the app, an
    # upgrade, a silent install, the uninstaller. Once on an Apple
    # silicon Mac and once on an Intel one; the package is the same.
    name: macOS package (.pkg, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the package
        run: packaging/macos/build.sh "0.0.0-ci-$(git rev-parse --short=12 HEAD)" dist
      - name: Install the package and use it
        run: |
          mkdir tools
          go build -o tools/ ./cmd/bb ./cmd/bb-server
          # A newer package, for the installed agent to update itself to.
          packaging/macos/build.sh 99.0.0 next
          BB_NEXT_PACKAGE="$(ls next/better-backup-agent_99.0.0_*.pkg)" packaging/test/agent.sh "$(ls dist/better-backup-agent_*.pkg)" tools shots
      - name: Check the signing setup
        run: packaging/test/macos-signing.sh
      - name: Build the server package
        run: packaging/macos/build-server.sh "0.0.0-ci-$(git rev-parse --short=12 HEAD)" dist "$(ls dist/better-backup-agent_*.pkg)"
      - name: Install the server package and use it
        run: packaging/test/server-macos.sh "$(ls dist/better-backup-server_*.pkg)"
      - name: Upload the package
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: better-backup-macos-package
          path: dist/*.pkg
          retention-days: 30
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots-${{ matrix.arch }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
